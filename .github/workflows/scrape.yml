name: Nightly data refresh

# Keeps insider.db fresh: scrape new SEC Form 4 filings + Tiingo prices, then
# commit the updated database back so the deployed Streamlit app reads new data
# (Streamlit Cloud auto-redeploys on push). app.py is never touched here.
on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily (low-traffic; ~1-2 AM US)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

# Let the built-in GITHUB_TOKEN push the updated database back to the repo.
permissions:
  contents: write

# Never let two refreshes run at once (would race on insider.db).
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the scraper's dependency. database.py/scraper.py use the stdlib
      # (sqlite3, json, tomllib, ...) otherwise — no streamlit/pandas, so this is fast.
      - name: Install scraper dependencies
        run: python -m pip install --upgrade requests

      # Tiingo key comes from the repo secret (never hardcoded). scraper.py reads
      # TIINGO_API_KEY from the environment; --max-tickers keeps us under the free
      # tier (50/hr, 1000/day) and prioritises tickers with no stored prices yet.
      - name: Run scraper
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python scraper.py --start 2025-01-01 --limit 200 --max-tickers 40

      - name: Commit updated database (only if it changed)
        run: |
          git config user.name  "insider-scraper-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insider.db
          if git diff --cached --quiet; then
            echo "insider.db unchanged — nothing to commit."
          else
            # [skip ci] avoids re-triggering any push-based CI. This workflow is
            # only schedule/dispatch-triggered, so it can't loop on its own push.
            git commit -m "chore: nightly data refresh [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Committed refreshed database."
          fi
